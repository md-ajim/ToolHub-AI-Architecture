services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: toolhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_plans && python manage.py seed_ai_models && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    volumes:
      - backend_media:/app/media
      - ./models_cache:/app/models_cache
      - ./comfyui/models:/app/comfyui/models:ro
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      SERVE_MEDIA: ${SERVE_MEDIA:-True}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/toolhub
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-300}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      AI_WORKSPACE_OPENROUTER_BASE_URL: ${AI_WORKSPACE_OPENROUTER_BASE_URL:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      META_API_KEY: ${META_API_KEY:-}
      AI_WORKSPACE_OPENAI_BASE_URL: ${AI_WORKSPACE_OPENAI_BASE_URL:-}
      AI_WORKSPACE_OPENAI_API_KEY: ${AI_WORKSPACE_OPENAI_API_KEY:-}
      AI_WORKSPACE_OPEN_BASE_URL: ${AI_WORKSPACE_OPEN_BASE_URL:-}
      AI_WORKSPACE_OPEN_API_KEY: ${AI_WORKSPACE_OPEN_API_KEY:-}
      AI_WORKSPACE_META_BASE_URL: ${AI_WORKSPACE_META_BASE_URL:-}
      XKIRO_API_KEY: ${XKIRO_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      HF_API_TOKEN: ${HF_API_TOKEN:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      # Cloudflare Workers AI — canonical CLOUDFLARE_* spelling plus the
      # legacy CLDFLARE_* aliases. Both are forwarded; the backend resolves
      # precedence CLOUDFLARE_* > CLDFLARE_* > CF_*, so existing .env files
      # using either spelling keep working without reconfiguration.
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLDFLARE_ACCOUNT_ID: ${CLDFLARE_ACCOUNT_ID:-}
      CLDFLARE_API_TOKEN: ${CLDFLARE_API_TOKEN:-}
      CLDFLARE_BASE_URL: ${CLDFLARE_BASE_URL:-https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/run/}
      AI_WORKSPACE_HF_BASE_URL: ${AI_WORKSPACE_HF_BASE_URL:-https://router.huggingface.co/v1}
      AI_WORKSPACE_SELF_HOSTED_BASE_URL: ${AI_WORKSPACE_SELF_HOSTED_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_WORKSPACE_SELF_HOSTED_API_KEY: ${AI_WORKSPACE_SELF_HOSTED_API_KEY:-ollama}
      U2NET_HOME: ${U2NET_HOME:-/app/models_cache/.u2net}
      COMFYUI_ENABLED: ${COMFYUI_ENABLED:-true}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      COMFYUI_TIMEOUT: ${COMFYUI_TIMEOUT:-5}
      COMFYUI_EXECUTION_TIMEOUT: ${COMFYUI_EXECUTION_TIMEOUT:-300}
      COMFYUI_MODELS_DIR: ${COMFYUI_MODELS_DIR:-/app/comfyui/models}
      COMFYUI_STRICT_WORKFLOW_VALIDATION: ${COMFYUI_STRICT_WORKFLOW_VALIDATION:-false}
      COMFYUI_QA_ACCESSIBLE: ${COMFYUI_QA_ACCESSIBLE:-true}
      COMFYUI_JOB_CONCURRENCY: ${COMFYUI_JOB_CONCURRENCY:-1}
      AI_HF_BRIA_RMBG_ENABLED: ${AI_HF_BRIA_RMBG_ENABLED:-false}
      AI_HF_QWEN_IMAGE_EDIT_ENABLED: ${AI_HF_QWEN_IMAGE_EDIT_ENABLED:-false}
      # Pay-per-use image providers (forwarded so root .env is the single
      # source of truth). Without these keys the providers report
      # not-configured and their models stay hidden from selectors.
      FAL_KEY: ${FAL_KEY:-}
      FAL_TIMEOUT: ${FAL_TIMEOUT:-300}
      PHOTOROOM_API_KEY: ${PHOTOROOM_API_KEY:-}
      PHOTOROOM_TIMEOUT: ${PHOTOROOM_TIMEOUT:-180}
      # Production quality gate (keep true): models reach paid-user
      # selectors only after `verify_models --live` records real inference.
      AI_REQUIRE_LIVE_VERIFICATION: ${AI_REQUIRE_LIVE_VERIFICATION:-true}
      # Transactional email (Resend via django-anymail). Without the key the
      # backend falls back to the console backend and no email is sent.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@toolhubai.pro}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-https://toolhubai.pro/logo/logo-horizontal.png}
      FRONTEND_URL: ${FRONTEND_URL:-${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}}
      SITE_URL: ${SITE_URL:-${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ./backend
    command: celery -A config worker -l info -Q celery,image_local_ai
    volumes:
      - backend_media:/app/media
      - ./models_cache:/app/models_cache
      - ./comfyui/models:/app/comfyui/models:ro
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/toolhub
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-300}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      AI_WORKSPACE_OPENROUTER_BASE_URL: ${AI_WORKSPACE_OPENROUTER_BASE_URL:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      META_API_KEY: ${META_API_KEY:-}
      AI_WORKSPACE_OPENAI_BASE_URL: ${AI_WORKSPACE_OPENAI_BASE_URL:-}
      AI_WORKSPACE_OPENAI_API_KEY: ${AI_WORKSPACE_OPENAI_API_KEY:-}
      AI_WORKSPACE_OPEN_BASE_URL: ${AI_WORKSPACE_OPEN_BASE_URL:-}
      AI_WORKSPACE_OPEN_API_KEY: ${AI_WORKSPACE_OPEN_API_KEY:-}
      AI_WORKSPACE_META_BASE_URL: ${AI_WORKSPACE_META_BASE_URL:-}
      XKIRO_API_KEY: ${XKIRO_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      HF_API_TOKEN: ${HF_API_TOKEN:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      # Cloudflare Workers AI — canonical CLOUDFLARE_* spelling plus the
      # legacy CLDFLARE_* aliases. Both are forwarded; the backend resolves
      # precedence CLOUDFLARE_* > CLDFLARE_* > CF_*, so existing .env files
      # using either spelling keep working without reconfiguration.
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLDFLARE_ACCOUNT_ID: ${CLDFLARE_ACCOUNT_ID:-}
      CLDFLARE_API_TOKEN: ${CLDFLARE_API_TOKEN:-}
      CLDFLARE_BASE_URL: ${CLDFLARE_BASE_URL:-https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/run/}
      AI_WORKSPACE_HF_BASE_URL: ${AI_WORKSPACE_HF_BASE_URL:-https://router.huggingface.co/v1}
      AI_WORKSPACE_SELF_HOSTED_BASE_URL: ${AI_WORKSPACE_SELF_HOSTED_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_WORKSPACE_SELF_HOSTED_API_KEY: ${AI_WORKSPACE_SELF_HOSTED_API_KEY:-ollama}
      U2NET_HOME: ${U2NET_HOME:-/app/models_cache/.u2net}
      COMFYUI_ENABLED: ${COMFYUI_ENABLED:-true}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      COMFYUI_TIMEOUT: ${COMFYUI_TIMEOUT:-5}
      COMFYUI_EXECUTION_TIMEOUT: ${COMFYUI_EXECUTION_TIMEOUT:-300}
      COMFYUI_MODELS_DIR: ${COMFYUI_MODELS_DIR:-/app/comfyui/models}
      COMFYUI_STRICT_WORKFLOW_VALIDATION: ${COMFYUI_STRICT_WORKFLOW_VALIDATION:-false}
      COMFYUI_QA_ACCESSIBLE: ${COMFYUI_QA_ACCESSIBLE:-true}
      COMFYUI_JOB_CONCURRENCY: ${COMFYUI_JOB_CONCURRENCY:-1}
      AI_HF_BRIA_RMBG_ENABLED: ${AI_HF_BRIA_RMBG_ENABLED:-false}
      AI_HF_QWEN_IMAGE_EDIT_ENABLED: ${AI_HF_QWEN_IMAGE_EDIT_ENABLED:-false}
      FAL_KEY: ${FAL_KEY:-}
      FAL_TIMEOUT: ${FAL_TIMEOUT:-300}
      PHOTOROOM_API_KEY: ${PHOTOROOM_API_KEY:-}
      PHOTOROOM_TIMEOUT: ${PHOTOROOM_TIMEOUT:-180}
      AI_REQUIRE_LIVE_VERIFICATION: ${AI_REQUIRE_LIVE_VERIFICATION:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@toolhubai.pro}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-https://toolhubai.pro/logo/logo-horizontal.png}
      FRONTEND_URL: ${FRONTEND_URL:-${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}}
      SITE_URL: ${SITE_URL:-${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - backend

  celery-beat:
    build:
      context: ./backend
    command: celery -A config beat --loglevel info
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/toolhub
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@toolhubai.pro}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-https://toolhubai.pro/logo/logo-horizontal.png}
      FRONTEND_URL: ${FRONTEND_URL:-${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}}
      SITE_URL: ${SITE_URL:-${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID}
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID}
    ports:
      - "${FRONTEND_PORT:-32768}:3000"

  # Cloudflare Tunnel (optional, additive). Runs `cloudflared` so the whole
  # Docker stack is reachable from Cloudflare edge without opening inbound
  # firewall ports. Enable with: docker compose --profile cloudflare up -d
  # Needs CLOUDFLARE_TUNNEL_TOKEN (token from your Zero Trust dashboard) plus
  # CLOUDFLARE_TUNNEL_HOSTNAME (e.g. app.example.com).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - cloudflare
    container_name: toolhub-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  backend_media:
